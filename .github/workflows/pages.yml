name: Publish the explorer

# Builds the hosted explorer from romgi's published catalogue and deploys it to GitHub Pages.
# Every push to main rebuilds. A check every three hours rebuilds only when romgi has published something new
# (romgi's catalogue changes weekly, on Sundays). The catalogue is downloaded on every build and never committed.
on:
  push:
    branches: [main]
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      rebuild: ${{ steps.compare.outputs.rebuild }}
    steps:
      - id: compare
        env:
          EVENT: ${{ github.event_name }}
          SITE: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/version.json
        run: |
          python3 - <<'PY'
          import json, os, urllib.request

          def get(url):
              try:
                  req = urllib.request.Request(url, headers={"User-Agent": "romgi-explorer", "Cache-Control": "no-cache"})
                  with urllib.request.urlopen(req, timeout=30) as r:
                      return json.load(r)
              except Exception as e:
                  print("could not read", url, "-", e)
                  return None

          ours = get(os.environ["SITE"])
          theirs = get("https://raw.githubusercontent.com/caprado/romgi/main/db/version.json")
          keys = ("version", "generated_at", "entries", "links")
          if os.environ["EVENT"] != "schedule":
              rebuild, why = True, "started by " + os.environ["EVENT"]
          elif not theirs:
              rebuild, why = False, "cannot read romgi's version.json, so the site stays as it is"
          elif not ours or any((ours.get("romgi") or {}).get(k) != theirs.get(k) for k in keys):
              rebuild, why = True, "romgi has published something the site does not show yet"
          else:
              rebuild, why = False, "the site already shows romgi's latest catalogue"
          print(why)
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write("rebuild=" + ("true" if rebuild else "false") + "\n")
          PY

  build:
    needs: check
    if: needs.check.outputs.rebuild == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write    # only to commit new rows of data/history.json
    steps:
      - uses: actions/checkout@v7

      - name: Download the published catalogue
        run: |
          RAW=https://raw.githubusercontent.com/caprado/romgi/main/db
          mkdir -p data dist
          curl -fsSL --retry 3 -o data/romdb.db.gz "$RAW/romdb.db.gz"
          curl -fsSL --retry 3 -o data/version.json "$RAW/version.json"
          gunzip -f data/romdb.db.gz
          cat data/version.json

      - name: Add the snapshots published since data/history.json was written
        run: python3 refresh_history.py
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Keep data/history.json current in the repository
        if: github.ref == 'refs/heads/main'
        continue-on-error: true      # a failed commit must not stop the site from updating
        run: |
          git diff --quiet data/history.json && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/history.json
          git commit -m "Add the weekly snapshots romgi has published"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Build the dataset
        run: python3 build_dataset.py --db data/romdb.db --version-json data/version.json --out dist/dataset.snapshot.json.gz --art-out dist/art.snapshot.json.gz

      - name: Check the dataset against SQL
        run: python3 tests/test_dataset.py data/romdb.db dist/dataset.snapshot.json.gz

      - name: Check the browser engine against SQL
        run: node tests/engine.test.js data/romdb.db dist/dataset.snapshot.json.gz 12

      - name: Build the site
        run: python3 bundle.py --dataset dist/dataset.snapshot.json.gz --art dist/art.snapshot.json.gz --pages --out-dir site --site-url "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/"

      - name: Check the site's catalogue file unpacks to the same dataset
        run: node tests/transport.test.js site/catalogue.*.bin dist/dataset.snapshot.json.gz

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
