name: Publish the explorer

# Builds the hosted explorer from romgi's published catalogue and deploys it to GitHub Pages.
# Every push to main rebuilds. A check every three hours rebuilds only when romgi has published something new
# (romgi's catalogue changes weekly, on Sundays). The catalogue is downloaded on every build and never committed.
# Two guards run first (drift.py): a catalogue in a format this explorer does not read stops the build, and one that looks
# unfinished (romgi has twice published one about 40% short) is held back: the site keeps showing the last complete one and says so.
on:
  push:
    branches: [main]
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch:
    inputs:
      accept_latest:
        description: "Show romgi's newest catalogue even if it looks unfinished"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      rebuild: ${{ steps.compare.outputs.rebuild }}
    steps:
      - uses: actions/checkout@v7
      - id: compare
        run: python3 drift.py rebuild --event "${{ github.event_name }}" --site "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/version.json"

  build:
    needs: check
    if: needs.check.outputs.rebuild == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write    # only to commit new rows of data/history.json
    steps:
      - uses: actions/checkout@v7

      - name: Read romgi's newest version.json
        run: |
          mkdir -p data dist
          curl -fsSL --retry 3 -o data/version.latest.json https://raw.githubusercontent.com/caprado/romgi/main/db/version.json
          cat data/version.latest.json

      - name: Add the snapshots published since data/history.json was written
        run: python3 refresh_history.py
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Keep data/history.json current in the repository
        if: github.ref == 'refs/heads/main'
        continue-on-error: true      # a failed commit must not stop the site from updating
        run: |
          git diff --quiet data/history.json && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/history.json
          git commit -m "Add the weekly snapshots romgi has published"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Choose the catalogue to show (the newest, unless it looks unfinished)
        id: pick
        run: python3 drift.py pick --latest data/version.latest.json --history data/history.json --out data/pick.json
        env:
          ROMGI_ACCEPT_LATEST: ${{ inputs.accept_latest }}

      - name: Download that catalogue
        run: |
          RAW="https://raw.githubusercontent.com/caprado/romgi/${{ steps.pick.outputs.ref }}/db"
          curl -fsSL --retry 3 -o data/romdb.db.gz "$RAW/romdb.db.gz"
          curl -fsSL --retry 3 -o data/version.json "$RAW/version.json"
          gunzip -f data/romdb.db.gz
          cat data/version.json

      - name: Check it is in the format this explorer reads
        run: python3 drift.py check data/romdb.db data/version.json

      - name: Build the dataset
        run: python3 build_dataset.py --db data/romdb.db --version-json data/version.json --out dist/dataset.snapshot.json.gz --art-out dist/art.snapshot.json.gz

      - name: Check the dataset against SQL
        run: python3 tests/test_dataset.py data/romdb.db dist/dataset.snapshot.json.gz

      - name: Check that links round-trip (every filter value, random slices, odd names)
        run: node tests/url.test.js dist/dataset.snapshot.json.gz

      - name: Check the Spanish dictionary (every message translated, nothing lost, nothing unused)
        run: node tests/i18n.test.js dist/dataset.snapshot.json.gz

      - name: Check the guards and the explorer's handling of a source it has not seen
        run: |
          python3 tests/make_fixture.py data/romdb.db dist/fixture/romdb.db --extra-source
          python3 build_dataset.py --db dist/fixture/romdb.db --version-json dist/fixture/version.json --out dist/fixture/dataset.json.gz --art-out dist/fixture/art.json.gz
          python3 tests/test_drift.py dist/fixture/romdb.db
          python3 tests/test_dataset.py dist/fixture/romdb.db dist/fixture/dataset.json.gz
          node tests/sources.test.js dist/fixture/romdb.db dist/fixture/dataset.json.gz
          node tests/engine.test.js dist/fixture/romdb.db dist/fixture/dataset.json.gz 10

      - name: Check the browser engine against SQL
        run: node tests/engine.test.js data/romdb.db dist/dataset.snapshot.json.gz 12

      - name: Build the link-free copy the SQL console runs on
        run: python3 livedb.py data/romdb.db dist/livedb.sqlite.gz --gzip

      - name: Check that copy against the original
        run: python3 tests/test_livedb.py data/romdb.db dist/livedb.sqlite.gz

      - name: Build the site
        run: python3 bundle.py --dataset dist/dataset.snapshot.json.gz --art dist/art.snapshot.json.gz --live-db dist/livedb.sqlite.gz --pick data/pick.json --pages --out-dir site --site-url "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/"

      - name: Check the SQL console's engine
        run: node tests/sqlconsole.test.js dist/livedb.sqlite.gz site/vendor/sqljs dist/dataset.snapshot.json.gz

      - name: Check the site's two data files unpack to the same dataset
        run: node tests/transport.test.js site/catalogue.*.bin site/detail.*.bin dist/dataset.snapshot.json.gz

      - name: Check the page works from the first file alone, and again when the second arrives
        run: node tests/early.test.js site/catalogue.*.bin site/detail.*.bin dist/dataset.snapshot.json.gz

      - name: Open the built site in a real browser and use it
        run: |
          npm install --no-save --no-audit --no-fund playwright-core@1.49.1
          node tests/smoke.test.js site
        env:
          CHROME_PATH: /usr/bin/google-chrome

      - name: Read the page in Spanish in a real browser (no English left, the switch, the single-file build)
        run: |
          python3 bundle.py --dataset dist/dataset.snapshot.json.gz
          node tests/lang.test.js site dist/romgi-explorer.standalone.html
        env:
          CHROME_PATH: /usr/bin/google-chrome

      - name: Check the installable app (saved on a first visit, opens offline, takes a newer build when asked)
        run: node tests/offline.test.js site dist/dataset.snapshot.json.gz dist/art.snapshot.json.gz
        env:
          CHROME_PATH: /usr/bin/google-chrome

      - name: Write the run summary
        run: python3 drift.py summary site data/pick.json

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
